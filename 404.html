<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b2b68" />
    <title>404 — Artjom Becker</title>
    <style>
      :root{--blue:#0b2b68;--bright:#8fc0ff;--soft:#dceaff;--line:rgba(220,234,255,.18);--mono:ui-monospace,SFMono-Regular,Consolas,monospace;--sans:Arial,sans-serif}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--blue);color:var(--soft);font-family:var(--sans)}body{overflow:hidden}.page{position:relative;min-height:100vh;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 50% 44%,#194995 0,#0b2b68 48%,#061a47 100%)}.page:before,.page:after{content:"";position:absolute;inset:0;pointer-events:none}.page:before{opacity:.27;background-image:linear-gradient(rgba(143,192,255,.16) 1px,transparent 1px),linear-gradient(90deg,rgba(143,192,255,.16) 1px,transparent 1px);background-size:58px 58px;mask-image:linear-gradient(180deg,black,transparent 78%)}.page:after{background:radial-gradient(circle at 20% 30%,rgba(115,174,255,.18),transparent 20%),radial-gradient(circle at 80% 70%,rgba(41,105,224,.2),transparent 23%)}.nav,.content,.back{position:relative;z-index:2}.nav{position:absolute;top:18px;left:18px;right:18px;display:flex;justify-content:space-between;align-items:center}.brand,.back{color:var(--soft);text-decoration:none}.brand{font-weight:800;font-size:19px;letter-spacing:-.08em}.brand span{color:#5f9bff}.nav-status{font:10px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:#a8c7f5}.content{width:min(720px,88vw);text-align:center}.eyebrow{font:10px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:#6ea6ff}.code{margin:17px 0 0;font:800 clamp(110px,22vw,240px)/.78 var(--mono);letter-spacing:-.13em;color:#edf5ff;text-shadow:14px 0 #2766d9,-14px 0 rgba(255,83,162,.4);animation:signal 4s steps(1,end) infinite}.content h1{margin:38px 0 12px;font-size:clamp(25px,4vw,44px);letter-spacing:-.06em;color:#fff}.content p{max-width:445px;margin:0 auto;color:#9eb7df;font-size:14px;line-height:1.7}.actions{display:flex;justify-content:center;gap:12px;margin-top:31px;flex-wrap:wrap}.button{border:1px solid var(--line);border-radius:999px;padding:12px 17px;color:var(--soft);font:11px var(--mono);text-decoration:none;background:rgba(220,234,255,.08);transition:background .2s,transform .2s}.button:hover{background:rgba(143,192,255,.25);transform:translateY(-2px)}.button-primary{background:#eaf3ff;color:#0b2b68}.easter{position:absolute;right:8vw;bottom:13vh;display:grid;place-items:center;width:75px;height:75px;border:1px solid rgba(220,234,255,.35);border-radius:50%;background:rgba(11,43,104,.38);color:#b9d6ff;font:22px var(--mono);cursor:pointer;transition:transform .3s,background .3s}.easter:hover{transform:rotate(18deg) scale(1.08);background:rgba(73,136,255,.3)}.easter small{position:absolute;top:84px;width:180px;text-align:center;opacity:0;color:#8fb4ed;font:9px var(--mono);letter-spacing:.08em;text-transform:uppercase;transition:opacity .25s}.easter.is-found small{opacity:1}.easter.is-found{animation:found .6s ease}.back{position:absolute;bottom:26px;left:50%;transform:translateX(-50%);font:10px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:#8fb4ed}.back:hover{color:#fff}.hidden-message{position:fixed;inset:0;display:grid;place-items:center;padding:30px;background:rgba(4,18,49,.84);backdrop-filter:blur(12px);opacity:0;pointer-events:none;transition:opacity .3s;z-index:5}.hidden-message.is-open{opacity:1;pointer-events:auto}.message-box{max-width:420px;padding:28px;border:1px solid rgba(143,192,255,.35);background:#0b2b68;box-shadow:0 25px 80px rgba(0,0,0,.35);text-align:left}.message-box code{font:12px var(--mono);color:#79b0ff}.message-box h2{margin:16px 0 8px;color:#fff}.message-box p{margin:0;color:#a8c7f5;line-height:1.6;font-size:13px}.message-close{margin-top:22px;cursor:pointer;color:#dceaff;font:10px var(--mono);text-transform:uppercase}@keyframes signal{0%,90%,100%{transform:none;opacity:1}91%{transform:translateX(-5px);opacity:.75}92%{transform:translateX(7px)}93%{transform:none}}@keyframes found{50%{transform:scale(1.22) rotate(18deg)}to{transform:scale(1)}}@media(max-width:600px){.nav-status{display:none}.easter{right:9vw;bottom:15vh}.content h1{margin-top:29px}.code{text-shadow:7px 0 #2766d9,-7px 0 rgba(255,83,162,.4)}}
      .page{transition:filter .7s ease,opacity .7s ease}.lights-out .page{filter:brightness(.055) saturate(.35);opacity:.92}.light-switch{position:fixed;right:28px;bottom:28px;z-index:20;width:76px;height:118px;padding:8px;border:1px solid rgba(226,239,255,.45);border-radius:9px;background:#0a1429;box-shadow:0 18px 45px rgba(0,0,0,.55),inset 0 0 0 2px rgba(255,255,255,.04);color:#dceaff;cursor:pointer}.switch-plate{display:block;position:relative;width:100%;height:100%;border:1px solid rgba(220,234,255,.24);border-radius:5px;background:linear-gradient(#142544,#081329);box-shadow:inset 0 0 18px rgba(74,137,255,.12)}.switch-plate:before,.switch-plate:after{content:"";position:absolute;left:50%;width:4px;height:4px;transform:translateX(-50%);border-radius:50%;background:#5f7cae}.switch-plate:before{top:7px}.switch-plate:after{bottom:7px}.switch-toggle{position:absolute;left:50%;top:34px;width:28px;height:45px;transform:translateX(-50%);border:1px solid #7899cf;border-radius:5px;background:#132952;box-shadow:0 5px 8px rgba(0,0,0,.5);transition:transform .35s ease,background .35s ease}.switch-toggle:after{content:"";position:absolute;left:50%;top:7px;width:3px;height:18px;transform:translateX(-50%);border-radius:3px;background:#86b5ff}.light-switch[aria-pressed="true"] .switch-toggle{transform:translate(-50%,8px);background:#2869db;box-shadow:0 0 18px rgba(72,144,255,.8)}.switch-label{display:block;margin-top:7px;font:8px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:#91b8f4}.light-switch[aria-pressed="true"]{border-color:#80b4ff;box-shadow:0 0 35px rgba(60,135,255,.65),inset 0 0 0 2px rgba(255,255,255,.06)}@media(max-width:600px){.light-switch{right:18px;bottom:18px;transform:scale(.88);transform-origin:bottom right}}
    </style>
  </head>

      <nav class="nav" aria-label="404 Navigation"><a class="brand" href="/">AB<span>.</span></a><span class="nav-status">signal lost / route unknown</span></nav>
      <section class="content" aria-labelledby="title"><div class="eyebrow">error / page not found</div><div class="code" aria-hidden="true">404</div><h1 id="title">Diese Seite ist abgetaucht.</h1><p>Der Link führt gerade ins Leere. Die gute Nachricht: Deine nächste Idee muss nicht dort bleiben.</p><div class="actions"><a class="button button-primary" href="/">Zur Startseite ↗</a><a class="button" href="mailto:hello@artjom.dev">Artjom schreiben</a></div></section>
      <a class="back" href="/">esc / zurück zum System</a>
    </main>
    <script>document.body.classList.add('lights-out');</script>
  </body>
</html>
